pluginGroup=com.sterbenden.clockedin
pluginName=Clocked In
pluginVersion=0.1.0

# Oldest supported build (IntelliJ Platform 2026.3). No upper bound.
pluginSinceBuild=263

# IDE used to compile against and for runIde. Kept at the oldest supported release so the
# plugin only uses APIs that exist there.
platformVersion=2026.3

# IDE releases checked by verifyPlugin: the oldest and the newest supported release.
verifyIdeVersions=2026.3
# Optional: point at a locally installed IDE instead of downloading one, e.g. in
# ~/.gradle/gradle.properties:
# platformLocalPath=/path/to/intellij-idea

# GitHub repository (owner/name) whose releases host the plugin, for installing and updating
# from GitHub instead of the Marketplace. Used by the updatePluginsXml task.
githubRepository=HamzaLayas/clocked-in

kotlin.stdlib.default.dependency=false
org.gradle.configuration-cache=true
org.gradle.caching=true
