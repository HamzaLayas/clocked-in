# Publishes a GitHub release. It runs only when started by hand (Actions > Release > Run
# workflow) with the version tag to release, for example v0.2.0. The tag must already be
# pushed. Releases are normally made from a developer machine instead; see the release steps.
# The release carries the plugin ZIP and updatePlugins.xml, which IDEs use to install and
# update the plugin from
# https://github.com/<owner>/<repo>/releases/latest/download/updatePlugins.xml.
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to release, for example v0.2.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      - name: Check the tag matches pluginVersion
        run: |
          version=$(grep '^pluginVersion=' gradle.properties | cut -d= -f2)
          if [ "v$version" != "$TAG" ]; then
            echo "Tag $TAG doesn't match pluginVersion=$version in gradle.properties" >&2
            exit 1
          fi

      - name: Test, verify and build
        run: ./gradlew test verifyPlugin githubReleaseFiles -PgithubRepository=${{ github.repository }}

      - name: Release notes from CHANGELOG.md
        run: |
          version=${TAG#v}
          awk -v v="## $version" '$0 == v {on=1; next} /^## / {on=0} on' CHANGELOG.md > release-notes.md
          test -s release-notes.md || echo "Clocked In $version" > release-notes.md

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" \
            build/distributions/clocked-in-*.zip \
            build/distributions/updatePlugins.xml \
            --verify-tag \
            --latest \
            --title "Clocked In ${TAG#v}" \
            --notes-file release-notes.md
